[package]
name = "flick-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Joins the ultrasonic announcement to LocalSend's authenticated transfer."

[dependencies]
flick-proto = { path = "../flick-proto" }
# Apache 2.0, vendored in third_party. Needs the full feature set to build.
localsend = { path = "../../third_party/localsend/packages/core", features = ["full"] }
