[package]
name = "flick-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kotlin bindings for the shared Flick crates, generated with UniFFI."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "flick_ffi"

[dependencies]
flick-proto = { path = "../flick-proto" }
flick-gesture = { path = "../flick-gesture" }
flick-acoustic = { path = "../flick-acoustic" }
flick-core = { path = "../flick-core" }
uniffi = { version = "0.28", features = ["tokio"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
