name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per branch at a time. A newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust, format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml, so CI and the developer use the same compiler.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-run.sh "Format" cargo fmt --all --check
      - run: bash scripts/ci-run.sh "Clippy" cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/ci-run.sh "Rust tests" cargo test --workspace
      - name: AirDrop shader port gives the same result as the original
        run: bash scripts/ci-run.sh "Shader port" python3 scripts/check_airdrop_port.py
      - name: No em dash or en dash
        run: bash scripts/ci-run.sh "Style" bash scripts/check-style.sh

  bindings:
    name: Kotlin bindings match the Rust code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-run.sh "Bindings" bash scripts/check-bindings.sh

  android:
    name: Android, library, build and unit tests
    runs-on: ubuntu-latest
    needs: [rust, bindings]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Rust library for every Android processor
        run: >
          bash scripts/ci-run.sh "Rust library for Android"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
          -o android/app/src/main/jniLibs build -p flick-ffi --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        working-directory: android
        run: bash ../scripts/ci-run.sh "Gradle build" ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug
        # Reported but not blocking yet: the first run will list warnings that need a decision.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: flick-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: android/app/src/main/jniLibs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore

  smoke:
    name: App starts on an emulator and loads the Rust library
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 40
    # Not blocking yet: this job has never run. Remove the next line once it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: android/app/src/main/jniLibs
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: android/app/build/reports
          if-no-files-found: ignore

  release:
    name: Publish the APK for a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flick-debug-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
          generate_release_notes: true
