[package]
name = "flick-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sends and receives files between nearby devices on top of LocalSend's core."

[dependencies]
flick-proto = { path = "../flick-proto" }
# Apache 2.0, vendored in third_party. Needs the full feature set to build.
localsend = { path = "../../third_party/localsend/packages/core", features = ["full"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
pem = "4"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
